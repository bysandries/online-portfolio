    <rect x="824" y="1282" width="340" height="96" rx="12" fill="#101a2e" stroke="#1e2c49"/>
    <text x="848" y="1318" font-size="14" font-weight="600" fill="#e6edf6">Experience →</text>
    <text x="848" y="1344" font-size="12" fill="#8fa3bf">Roles across design, finance automation and IT.</text>
    <text x="824" y="1402" font-family="Geist Mono, monospace" font-size="10" fill="#8fa3bf">section-link card · title hover→accent</text>

    <rect x="824" y="1430" width="3" height="52" fill="#1496cd"/>
