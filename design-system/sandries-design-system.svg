<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="2320" viewBox="0 0 1600 2320" font-family="Geist, Arial, sans-serif">
  <defs>
    <radialGradient id="pin" cx="0.35" cy="0.3" r="0.9">
      <stop offset="0" stop-color="#ff8a8a"/>
      <stop offset="0.6" stop-color="#d61f1f"/>
      <stop offset="1" stop-color="#8e0f0f"/>
