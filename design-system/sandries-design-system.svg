    <text x="314"  y="598" font-size="13" fill="#e6edf6">accent-hover</text>
    <text x="548"  y="598" font-size="13" fill="#e6edf6">accent-soft</text>
    <text x="782"  y="598" font-size="13" fill="#e6edf6">cork</text>
    <text x="1016" y="598" font-size="13" fill="#e6edf6">pin-red (radial)</text>
    <text x="1250" y="598" font-size="13" fill="#e6edf6">polaroid</text>
    <text x="80"   y="616" font-family="Geist Mono, monospace" font-size="11" fill="#8fa3bf">#1496CD · brand blue</text>
    <text x="314"  y="616" font-family="Geist Mono, monospace" font-size="11" fill="#8fa3bf">#1178A5 · hover</text>
    <text x="548"  y="616" font-family="Geist Mono, monospace" font-size="11" fill="#8fa3bf">#B5D4E6 · chips / links</text>
    <text x="782"  y="616" font-family="Geist Mono, monospace" font-size="11" fill="#8fa3bf">#C19A5B + noise texture</text>
    <text x="1016" y="616" font-family="Geist Mono, monospace" font-size="11" fill="#8fa3bf">#FF8A8A→#D61F1F→#8E0F0F</text>
    <text x="1250" y="616" font-family="Geist Mono, monospace" font-size="11" fill="#8fa3bf">#FFFFFF · flyer frame</text>
