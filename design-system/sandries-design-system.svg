    <text x="548"  y="394" font-size="13" fill="#e6edf6">panel-raised</text>
    <text x="782"  y="394" font-size="13" fill="#e6edf6">edge</text>
    <text x="1016" y="394" font-size="13" fill="#e6edf6">ink</text>
    <text x="1250" y="394" font-size="13" fill="#e6edf6">muted</text>
    <text x="80"   y="412" font-family="Geist Mono, monospace" font-size="11" fill="#8fa3bf">#0B1220 · page bg</text>
    <text x="314"  y="412" font-family="Geist Mono, monospace" font-size="11" fill="#8fa3bf">#101A2E · cards</text>
    <text x="548"  y="412" font-family="Geist Mono, monospace" font-size="11" fill="#8fa3bf">#16233C · active / tags</text>
    <text x="782"  y="412" font-family="Geist Mono, monospace" font-size="11" fill="#8fa3bf">#1E2C49 · borders</text>
    <text x="1016" y="412" font-family="Geist Mono, monospace" font-size="11" fill="#8fa3bf">#E6EDF6 · text</text>
    <text x="1250" y="412" font-family="Geist Mono, monospace" font-size="11" fill="#8fa3bf">#8FA3BF · secondary</text>
  </g>

  <text x="80" y="466" font-size="11" font-weight="600" letter-spacing="1.1" fill="#8fa3bf">COLORS — ACCENT &amp; CORK BOARD</text>
  <g>
    <rect x="80"   y="490" width="210" height="84" rx="12" fill="#1496cd"/>
    <rect x="314"  y="490" width="210" height="84" rx="12" fill="#1178a5"/>
    <rect x="548"  y="490" width="210" height="84" rx="12" fill="#b5d4e6"/>
    <rect x="782"  y="490" width="210" height="84" rx="12" fill="#c19a5b"/>
    <rect x="1016" y="490" width="210" height="84" rx="12" fill="url(#pin)"/>
    <rect x="1250" y="490" width="210" height="84" rx="12" fill="#ffffff"/>
