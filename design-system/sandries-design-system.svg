    <text x="1132" y="1646" font-size="24" fill="#ffffff">×</text>
  </g>

  <!-- Radii / spacing spec panel -->
  <g>
    <rect x="1196" y="1610" width="324" height="340" rx="12" fill="#101a2e" stroke="#1e2c49"/>
    <text x="1220" y="1644" font-size="11" font-weight="600" letter-spacing="1.1" fill="#8fa3bf">GEOMETRY</text>
    <text x="1220" y="1676" font-family="Geist Mono, monospace" font-size="11" fill="#e6edf6">radius  12 · card / board / pre</text>
    <text x="1220" y="1698" font-family="Geist Mono, monospace" font-size="11" fill="#e6edf6">radius   6 · buttons / chips / nav</text>
    <text x="1220" y="1720" font-family="Geist Mono, monospace" font-size="11" fill="#e6edf6">radius   4 · tech tags / code</text>
    <text x="1220" y="1742" font-family="Geist Mono, monospace" font-size="11" fill="#e6edf6">radius   2 · polaroid frame</text>
    <text x="1220" y="1772" font-family="Geist Mono, monospace" font-size="11" fill="#e6edf6">border   1 · always edge #1E2C49</text>
    <text x="1220" y="1802" font-family="Geist Mono, monospace" font-size="11" fill="#e6edf6">card pad    20 / 24</text>
    <text x="1220" y="1824" font-family="Geist Mono, monospace" font-size="11" fill="#e6edf6">page gutter 24 · header h 48</text>
    <text x="1220" y="1846" font-family="Geist Mono, monospace" font-size="11" fill="#e6edf6">section pad 56 vert (landing)</text>
    <text x="1220" y="1876" font-family="Geist Mono, monospace" font-size="11" fill="#e6edf6">max-w  768 · blog / education</text>
    <text x="1220" y="1898" font-family="Geist Mono, monospace" font-size="11" fill="#e6edf6">max-w 1024 · landing sections</text>
    <text x="1220" y="1920" font-family="Geist Mono, monospace" font-size="11" fill="#e6edf6">max-w 1152 · designs board</text>
  </g>

  <!-- ============ Principles ============ -->
  <text x="80" y="2072" font-size="11" font-weight="600" letter-spacing="1.1" fill="#8fa3bf">PRINCIPLES</text>
  <text x="80" y="2104" font-size="14" fill="#e6edf6">1 · One committed dark theme — no light mode, no toggles. Surfaces step up canvas → panel → panel-raised.</text>
  <text x="80" y="2132" font-size="14" fill="#e6edf6">2 · Accent blue is for interaction: links, active nav, hover borders, primary CTAs. Accent-soft carries metadata.</text>
  <text x="80" y="2160" font-size="14" fill="#e6edf6">3 · Mono type marks data: dates, tags, chips, section annotations. Sans carries voice.</text>
  <text x="80" y="2188" font-size="14" fill="#e6edf6">4 · The cork board is the one warm object in a cool room — its physicality (pins, shadows, rotation) stays intact.</text>
  <text x="80" y="2216" font-size="14" fill="#e6edf6">5 · Hover = border-color shift to accent, never scale or elevation (except the draggable polaroids).</text>

  <text x="80" y="2276" font-family="Geist Mono, monospace" font-size="11" fill="#8fa3bf">sandries.com design system · extracted from online-portfolio (Next.js 16 · Tailwind v4 @theme) · Aug 2026</text>
</svg>
