  <!-- ============ Header ============ -->
  <text x="80" y="104" font-family="Geist Mono, monospace" font-size="13" letter-spacing="1.4" fill="#1496cd">DESIGN · SOFTWARE · INNOVATION</text>
  <text x="80" y="156" font-size="40" font-weight="700" letter-spacing="-1" fill="#e6edf6">sandries.com <tspan fill="#1496cd">Design System</tspan></text>
  <text x="80" y="190" font-size="14" fill="#8fa3bf">Unified portfolio — dark-navy shell, Geist type, warm cork-board accent. Source of truth: app/globals.css + component idioms.</text>

