  <!-- ============ Typography ============ -->
  <text x="80" y="700" font-size="11" font-weight="600" letter-spacing="1.1" fill="#8fa3bf">TYPOGRAPHY — GEIST / GEIST MONO</text>

  <text x="80" y="762" font-size="48" font-weight="700" letter-spacing="-1.2" fill="#e6edf6">Luis <tspan fill="#1496cd">Bedoya Sandries</tspan></text>
  <text x="1100" y="762" font-family="Geist Mono, monospace" font-size="11" fill="#8fa3bf">display · 48/700 · -0.025em</text>

  <text x="80" y="822" font-size="24" font-weight="700" letter-spacing="-0.6" fill="#e6edf6">Page title — Designs</text>
  <text x="1100" y="822" font-family="Geist Mono, monospace" font-size="11" fill="#8fa3bf">h1 · 24/700 · -0.025em</text>

  <text x="80" y="864" font-size="18" font-weight="600" fill="#e6edf6">Post heading — Getting the Hiring Letter</text>
