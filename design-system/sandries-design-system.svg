  <text x="80" y="900" font-size="11" font-weight="600" letter-spacing="1.1" fill="#8fa3bf">FEATURED PROJECTS</text>
  <text x="1100" y="900" font-family="Geist Mono, monospace" font-size="11" fill="#8fa3bf">section label · 11/600 · +0.1em · uppercase · muted</text>

  <text x="80" y="934" font-size="14" fill="#e6edf6">Body copy — I build full-stack tools that turn messy public data into something people can actually use.</text>
  <text x="1100" y="934" font-family="Geist Mono, monospace" font-size="11" fill="#8fa3bf">body · 14/400 · lh 1.62</text>

  <text x="80" y="966" font-size="12" fill="#8fa3bf">Caption — Two AAS-T degrees in progress (Dec 2026), certifications, and course-linked projects.</text>
  <text x="1100" y="966" font-family="Geist Mono, monospace" font-size="11" fill="#8fa3bf">caption · 12/400 · muted</text>

  <text x="80" y="998" font-family="Geist Mono, monospace" font-size="11" fill="#b5d4e6">Mono chip — November 2, 2023 · AWS Academy Graduate</text>
  <text x="1100" y="998" font-family="Geist Mono, monospace" font-size="11" fill="#8fa3bf">chip · Geist Mono 11/400 · accent-soft</text>

