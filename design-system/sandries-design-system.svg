  <!-- ============ Cork board ============ -->
  <text x="80" y="1584" font-size="11" font-weight="600" letter-spacing="1.1" fill="#8fa3bf">CORK BOARD — WARM SURFACE ON THE DARK SHELL</text>

  <!-- Cork surface with polaroids -->
  <g>
    <rect x="80" y="1610" width="560" height="340" rx="12" fill="#c19a5b" stroke="#1e2c49"/>
    <!-- polaroid 1 (rotated) -->
    <g transform="rotate(-4 250 1790)" filter="url(#polaroidShadow)">
      <rect x="160" y="1670" width="180" height="240" rx="2" fill="#ffffff"/>
      <rect x="172" y="1682" width="156" height="196" fill="#d8dde4"/>
      <circle cx="250" cy="1666" r="9" fill="url(#pin)"/>
    </g>
    <!-- polaroid 2 (rotated other way) -->
    <g transform="rotate(3 480 1790)" filter="url(#polaroidShadow)">
      <rect x="390" y="1690" width="180" height="240" rx="2" fill="#ffffff"/>
      <rect x="402" y="1702" width="156" height="196" fill="#c8cfd8"/>
      <circle cx="480" cy="1686" r="9" fill="url(#pin)"/>
    </g>
  </g>
  <text x="80" y="1978" font-family="Geist Mono, monospace" font-size="10" fill="#8fa3bf">cork #C19A5B + dot-noise texture · inset vignette rgba(60,35,10,.35)/60 · polaroid: white r2, p8, pb12, seeded rotate ±6°</text>
  <text x="80" y="1996" font-family="Geist Mono, monospace" font-size="10" fill="#8fa3bf">polaroid shadow rest: 0 6 14 rgba(0,0,0,.32) + 0 2 4 rgba(0,0,0,.2) · dragging: 0 18 36 rgba(0,0,0,.45) + 0 4 8 rgba(0,0,0,.3)</text>
  <text x="80" y="2014" font-family="Geist Mono, monospace" font-size="10" fill="#8fa3bf">lightbox: scrim rgba(20,14,8,.92) · image shadow 0 20 60 rgba(0,0,0,.6) · captions #F3E9DA / #CBB89A</text>

  <!-- Lightbox spec -->
  <g>
    <rect x="700" y="1610" width="460" height="340" rx="12" fill="#140e08" fill-opacity="0.92" stroke="#1e2c49"/>
    <rect x="850" y="1650" width="160" height="212" rx="4" fill="#d8dde4"/>
    <text x="930" y="1898" font-size="13" font-weight="600" fill="#f3e9da" text-anchor="middle">SAB – Red Cross Blood Drive</text>
