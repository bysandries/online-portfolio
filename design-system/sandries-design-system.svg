    <rect x="452" y="1282" width="340" height="216" rx="12" fill="#101a2e" stroke="#1e2c49"/>
    <text x="476" y="1316" font-family="Geist Mono, monospace" font-size="11" fill="#b5d4e6">November 2, 2023</text>
    <text x="476" y="1344" font-size="14" font-weight="600" fill="#e6edf6">My Experience Getting an On-Campus</text>
    <text x="476" y="1364" font-size="14" font-weight="600" fill="#e6edf6">Job as an International Student</text>
    <text x="476" y="1392" font-size="12" fill="#8fa3bf">Getting an on-campus job is a great way to</text>
    <text x="476" y="1410" font-size="12" fill="#8fa3bf">gain work experience while receiving…</text>
    <rect x="476" y="1438" width="56" height="24" rx="4" fill="#16233c" stroke="#1e2c49"/>
    <text x="504" y="1454" font-family="Geist Mono, monospace" font-size="10" fill="#b5d4e6" text-anchor="middle">Career</text>
    <text x="476" y="1486" font-family="Geist Mono, monospace" font-size="10" fill="#8fa3bf">blog card · date → title → summary → tags</text>
  </g>

