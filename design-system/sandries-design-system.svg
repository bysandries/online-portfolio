    <rect x="80" y="1282" width="340" height="216" rx="12" fill="#101a2e" stroke="#1e2c49"/>
    <text x="104" y="1318" font-size="14" font-weight="600" fill="#e6edf6">Washington Affordable Housing Search</text>
    <text x="104" y="1340" font-size="12" fill="#b5d4e6">Statewide search engine for affordable housing</text>
    <text x="104" y="1368" font-size="12" fill="#8fa3bf">A full-stack, special-purpose search engine that</text>
    <text x="104" y="1386" font-size="12" fill="#8fa3bf">makes Washington's scattered affordable-housing</text>
    <text x="104" y="1404" font-size="12" fill="#8fa3bf">landscape actually searchable…</text>
